name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        go: ['1.26']

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}

      - name: Cache Go modules
        uses: actions/cache@v6
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download dependencies
        run: go mod download

      - name: Verify gofmt
        if: matrix.os == 'ubuntu-latest'
        run: make fmt-check

      - name: Verify go.mod is tidy
        if: matrix.os == 'ubuntu-latest'
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Run tests
        run: make test

      - name: Enforce coverage floor
        if: matrix.os == 'ubuntu-latest'
        run: make cover-check

      - name: Run race detector
        run: go test -race -short ./...

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        if: matrix.os == 'ubuntu-latest'
        with:
          files: ./coverage.out
          flags: unittests
          name: codecov-${{ matrix.os }}

  supply-chain:
    name: Supply chain
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.6'
          cache: true

      # Pinned to the patch, not the minor: `1.26` resolved to 1.26.5 while the
      # advisories below were fixed in 1.26.6, so the scan would have passed on
      # a toolchain that still shipped them. Bump this when govulncheck fails
      # on the standard library -- that is the gate doing its job.
      # Known-vulnerable dependencies, and the standard library this is built
      # against. Nothing in CI reported either before.
      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      # The SBOM is deterministic, so regenerating it is a no-op unless the
      # dependency set actually changed.
      - name: Check SBOM is current
        run: make sbom-check

      - name: Check dependency licenses
        run: make license-check

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # Pinned for reproducible linting; matches the version documented in
          # CONTRIBUTING.md and the local `make lint` target. Config lives in
          # .golangci.yml (v2 format).
          version: v2.12.2

  config-examples:
    name: Config examples
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'

      # Validates configs/examples/*.yaml against the real schema with
      # `check-config`. These files back the documented examples, so a config
      # that references a removed or misspelled key fails here instead of
      # silently misleading a reader. Deployment manifests (docker-compose,
      # k8s) live under deploy/ and are intentionally not matched.
      - name: Validate example configs
        run: make check-configs

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test, lint]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'

      - name: Build all platforms
        run: make build-all

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: binaries
          path: build/cbox-init-*
          retention-days: 7

  integration-test:
    name: Integration Test (${{ matrix.distro }})
    runs-on: ubuntu-latest
    needs: [build]
    strategy:
      matrix:
        distro: [alpine, debian, ubuntu]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: binaries
          path: build/

      - name: Make binaries executable
        run: chmod +x build/cbox-init-*

      - name: Run integration tests - ${{ matrix.distro }}
        run: |
          docker build \
            -f tests/integration/Dockerfile.${{ matrix.distro }} \
            -t cbox-init-test-${{ matrix.distro }} \
            .

          docker run --rm \
            --name cbox-init-test-${{ matrix.distro }} \
            cbox-init-test-${{ matrix.distro }}

      - name: Test with real workload
        run: |
          docker run -d \
            --name cbox-init-workload-${{ matrix.distro }} \
            -p 9090:9090 \
            -p 9180:9180 \
            cbox-init-test-${{ matrix.distro }}

          # Wait for startup with retries
          echo "Waiting for services to be ready..."
          for i in {1..30}; do
            if curl -sf http://localhost:9090/metrics > /dev/null 2>&1; then
              echo "Metrics endpoint ready after ${i}s"
              break
            fi
            sleep 1
          done

          # Test metrics endpoint
          curl -f http://localhost:9090/metrics || exit 1

          # Wait for API with retries
          for i in {1..30}; do
            if curl -sf http://localhost:9180/api/v1/health > /dev/null 2>&1; then
              echo "API endpoint ready after ${i}s"
              break
            fi
            sleep 1
          done

          # Test API endpoint
          curl -f http://localhost:9180/api/v1/health || exit 1

          # Cleanup
          docker stop cbox-init-workload-${{ matrix.distro }}
